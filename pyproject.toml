[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-foundry-lab"
version = "0.1.0"
description = "A small, production-minded Microsoft Foundry learning lab and document assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Micro Foundry Lab contributors" }]
dependencies = [
  "azure-ai-projects>=2.3.0",
  "azure-identity>=1.25.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/micro_foundry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
